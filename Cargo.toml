[workspace]
resolver = "2"
members = ["crates/marquee-core", "src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["Anthony LaRosa"]
repository = "https://github.com/larosa023/Marquee"

# Small, fast release binaries (same profile as the other Tauri apps in the suite).
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 1
