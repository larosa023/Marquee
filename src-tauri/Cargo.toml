[package]
name = "marquee"
description = "New movies, shows, games and albums, picked for your taste."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version = "1.88"

[lib]
name = "marquee_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
marquee-core = { path = "../crates/marquee-core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
tracing-appender = "0.2"
urlencoding = "2"
url = "2"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
winreg = "0.52"
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_Foundation"] }

[features]
# Lets `cargo test`/`cargo check` run without bundling.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
