[package]
name = "marquee-core"
description = "Marquee's engine: catalog, integrations, taste engine, sync, data. No UI or Tauri code."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
async-trait = "0.1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
urlencoding = "2"
sha2 = "0.10"
md-5 = "0.10"
base64 = "0.22"
rand = "0.8"
csv = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
tracing = "0.1"
futures = "0.3"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
